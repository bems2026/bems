# iBEMS RM-166 (2026-11-04): Wi-Fi power save off, on every profile. The device AP threw the Pi off 464 times in two
# days for inactivity (reason=4) while the Pi was logging every minute, with power save on, the Raspberry Pi default.
# NetworkManager's value 2 is "disable"; it applies at each activation, so a working connection is not dropped.
#
# Installed by scripts/install.sh as /etc/NetworkManager/conf.d/50-ibems-wifi.conf, so a rebuild does not lose it
# silently. `npm run preflight` checks it is in place (host_wifi_powersave).
[connection]
wifi.powersave=2
