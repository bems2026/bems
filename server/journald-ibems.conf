# iBEMS RM-125 (2026-09-22): a bounded persistent journal, so a reboot no longer erases what
# Node-RED and the daemons logged — on 2026-09-21 two reboots left the database as the only
# witness to a device fault. Overrides Raspberry Pi OS's own
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (SD-card wear), bounded to
# keep that concern: 200 MB in all, 32 MB files, 90 days. The main journald.conf is untouched.
#
# Installed by scripts/install.sh as /etc/systemd/system/journald.conf.d/50-ibems-persistent.conf
# (RM-148, F-010: until then it lived only on the edge, and a rebuild would have lost it silently).
# `npm run preflight` checks it is in force (host_journal).
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=32M
MaxRetentionSec=90day
