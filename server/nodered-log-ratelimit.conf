# systemd drop-in for nodered.service. Install alongside the units in this directory:
#
#     sudo mkdir -p /etc/systemd/system/nodered.service.d
#     sudo cp server/nodered-log-ratelimit.conf /etc/systemd/system/nodered.service.d/
#     sudo systemctl daemon-reload && sudo systemctl restart nodered
#     systemctl show nodered -p LogRateLimitIntervalUSec -p LogRateLimitBurst
#
# Added 2026-08-20 while every Tuya device was unreachable. node-red-contrib-tuya-smart-device
# retries discovery continuously, and with 18 devices down that produced ~104,500 journal
# lines/hour — 99% of ALL logging on this Pi. journald rotates within its size cap, so the
# practical effect was that the journal stopped retaining more than ~3 hours of history:
# any unrelated fault would have had almost no evidence left to diagnose from.
#
# This caps nodered specifically (not journald globally, which would blind every other unit).
# journald still records a "N messages suppressed" marker, so the flood is visible as a fact
# without being stored line by line. Remove this file once the site network is fixed if the
# full firehose is ever wanted back.
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
